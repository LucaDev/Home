---
version: "3"

includes:
  flux:
    dir: .taskfiles/flux
    taskfile: .taskfiles/flux
  k8s:
    taskfile: .taskfiles/k8s
    dir: .taskfiles/k8s
  sops:
    taskfile: ".taskfiles/sops"
    dir: .taskfiles/sops
  volsync:
    taskfile: ".taskfiles/volsync"
    dir: .taskfiles/volsync

tasks:
  default:
    silent: true
    cmds:
      - task -l

  readme:generate:
    desc: Regenerate the app tree in README.md from apps/
    cmd: .taskfiles/_scripts/gen-readme-tree.sh

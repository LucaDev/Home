---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-pg
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
    storageClass: ssd-singlereplica
  monitoring:
    enablePodMonitor: true
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  managed:
    roles:
      # UniFi OS (apps/networking/unifi-os/db): generated passwords
      - name: unifi-core
        login: true
        createdb: true
        passwordSecret:
          name: unifi-os-pg-unifi-core
      - name: ulp-go
        login: true
        passwordSecret:
          name: unifi-os-pg-ulp-go
      - name: unifi-directory
        login: true
        passwordSecret:
          name: unifi-os-pg-unifi-directory
      - name: ucs-agent
        login: true
        passwordSecret:
          name: unifi-os-pg-ucs-agent
      - name: unifi-identity-update
        login: true
        passwordSecret:
          name: unifi-os-pg-unifi-identity-update
      - name: unifi_network_admin
        login: true
        createdb: true
        passwordSecret:
          name: unifi-os-pg-unifi-network-admin
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 10Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: shared-pg-backup
        serverName: shared-pg-1

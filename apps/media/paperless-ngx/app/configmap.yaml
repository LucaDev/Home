---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-configmap
data:
  # Configure application
  PAPERLESS_URL: https://paperless.lucadev.de
  PAPERLESS_PORT: "8000"
  PAPERLESS_TIME_ZONE: "Europe/Berlin"
  PAPERLESS_WEBSERVER_WORKERS: "1"
  PAPERLESS_TASK_WORKERS: "1"

  # Configure OIDC
  PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
  PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
  PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_DISABLE_REGULAR_LOGIN: "true"

  # Configure folders
  PAPERLESS_CONSUMPTION_DIR: /data/consume
  PAPERLESS_DATA_DIR: /data/local/data
  PAPERLESS_EXPORT_DIR: /data/export
  PAPERLESS_MEDIA_ROOT: /data/local/media

  # Configure folder importer
  PAPERLESS_CONSUMER_RECURSIVE: "true"
  PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
  PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
  PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"

  # Configure OCR
  PAPERLESS_OCR_LANGUAGES: deu eng
  PAPERLESS_OCR_LANGUAGE: deu
  PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'

  # Configure redis integration
  PAPERLESS_REDIS: redis://shared-redis.databases.svc.cluster.local:6379

  # Configure user permissions
  USERMAP_GID: "65543"

  # Configure AI via LiteLLM (API key comes from the paperless-litellm virtual key).
  # Values set in the UI (Settings > Configuration) override these.
  PAPERLESS_AI_ENABLED: "true"
  PAPERLESS_AI_LLM_BACKEND: openai-like
  PAPERLESS_AI_LLM_ENDPOINT: http://litellm.ai.svc.cluster.local:4000/v1
  PAPERLESS_AI_LLM_MODEL: openrouter/deepseek-v4.1-flash
  PAPERLESS_AI_LLM_CONTEXT_SIZE: "100000"
  PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: German
  # Endpoint and API key fall back to the LLM settings above.
  PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
  PAPERLESS_AI_LLM_EMBEDDING_MODEL: openrouter/text-embedding-3-small
  PAPERLESS_AI_LLM_EMBEDDING_CHUNK_SIZE: "8192"

  # Reverse Proxy Configuration
  PAPERLESS_ALLAUTH_TRUSTED_CLIENT_IP_HEADER: "X-Forwarded-For"

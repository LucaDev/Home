---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: paper
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Paperless"
  origin: "https://paperless.home.lucadev.de/"
  redirectUrl:
    - "paperparrot://oidc-callback"
    - "https://paperless.lucadev.de/accounts/oidc/kanidm/login/callback/"
    - "https://paperparrot.me/oidc-callback"
  scopeMap:
    - group: service_users
      scopes: [email, openid, profile]
  preferShortUsername: true
  disableConsentPrompt: true

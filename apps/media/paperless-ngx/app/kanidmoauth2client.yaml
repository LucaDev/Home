---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: paperless
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Paperless"
  origin: "https://paperless.lucadev.de/accounts/oidc/kanidm/login/callback/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/paperless-ngx.svg"
  public: true
  redirectUrl:
    - "https://paperparrot.me/oidc-callback"
    - "paperparrot://oidc-callback"
  scopeMap:
    - group: admins
      scopes: [email, groups, openid, profile]
  preferShortUsername: true

---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: chhoto-url
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Links"
  origin: "https://link.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/chhoto-url.svg"
  redirectUrl:
    - "https://link.lucadev.de/oidc/callback"
  scopeMap:
    - group: service_users
      scopes: [email, groups, openid, profile]
  disableConsentPrompt: true
  secretKeyAliases:
    clientSecret:
      - client-secret

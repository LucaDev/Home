---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app chhoto-url
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      chhoto:
        type: statefulset

        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 1Gi
              storageClass: ssd-dualreplica
              advancedMounts:
                app:
                  - path: /urls.sqlite
                    subPath: urls.sqlite

        containers:
          app:
            image:
              repository: docker.io/sintan1729/chhoto-url
              tag: 7.11.4
            resources:
              requests:
                cpu: 5m
                memory: 15M
              limits:
                cpu: 100m
                memory: 50M
            env:
              CHHOTO_SITE_URL: "https://link.lucadev.de"
              CHHOTO_REDIRECT_METHOD: "TEMPORARY"
              CHHOTO_OIDC_ISSUER_URL: "https://idm.lucadev.de/oauth2/openid/chhoto-url"
              CHHOTO_OIDC_CLIENT_ID: "chhoto-url"
              CHHOTO_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: chhoto-url-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              # refuse to start unauthenticated if OIDC discovery fails
              CHHOTO_EXIT_ON_NO_AUTH: "True"
        annotations:
          reloader.stakater.com/auto: "true"

    service:
      app:
        controller: chhoto
        ports:
          http:
            port: &port 4567

    route:
      app:
        hostnames:
          - link.lucadev.de
        parentRefs:
          - name: envoy
            sectionName: https
            kind: Gateway
            namespace: networking
        rules:
          - backendRefs:
              - name: *app
                port: *port

---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: tandoor
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Tandoor"
  origin: "https://tandoor.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/tandoor-recipes.svg"
  redirectUrl:
    - "https://tandoor.lucadev.de/accounts/oidc/kanidm/login/callback/"
  scopeMap:
    - group: service_users
      scopes: [email, groups, openid, profile]
  preferShortUsername: true
  disableConsentPrompt: true

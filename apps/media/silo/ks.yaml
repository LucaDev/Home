---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname silo
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *appname
  interval: 1h
  path: "./apps/media/silo/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: silo-db
    - name: redis
    - name: litellm
  postBuild:
    substitute:
      APP: *appname
      # Silo droppt nach dem Start auf PUID/PGID (Container startet als root),
      # gleiche IDs wie jellyfin/sonarr/radarr -> gleiche Dateirechte auf der Library
      APP_UID: "568"
      APP_GID: "568"
      VOLSYNC_CAPACITY: 5Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: silo-db
  namespace: flux-system
spec:
  interval: 1h
  path: "./apps/media/silo/db"
  # Rolle-Secret und Database-CR liegen neben shared-pg
  targetNamespace: databases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: external-secrets-stores
    - name: shared-pg

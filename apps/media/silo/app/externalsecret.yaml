---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: silo
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        DATABASE_URL: "postgres://silo:{{ .postgres_password }}@shared-pg-rw.databases.svc.cluster.local:5432/silo?sslmode=require"
  data:
    - secretKey: secret_key
      remoteRef:
        key: Silo
        property: secret_key
    # generiertes Passwort der shared-pg-Rolle (../db/externalsecret.yaml)
    - secretKey: postgres_password
      sourceRef:
        storeRef:
          kind: SecretStore
          name: silo-pg-password
      remoteRef:
        key: silo-pg
        property: password

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: silo
    template:
      data:
        SECRET_KEY: "{{ .secret_key }}"
        # urlquery: Sonderzeichen im Passwort muessen in der URL escaped sein
        DATABASE_URL: "postgres://silo:{{ .postgres_password | urlquery }}@shared-pg-rw.databases.svc.cluster.local:5432/silo?sslmode=require"
  data:
    - secretKey: secret_key
      remoteRef:
        key: Silo
        property: secret_key
    - secretKey: postgres_password
      remoteRef:
        key: Silo
        property: postgres_password

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      silo:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          enableServiceLinks: false

        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-2154
            env:
              TZ: Europe/Berlin
              PORT: "8080"
              JF_PORT: "8096"
              ABS_PORT: "13378"
              PUID: "${APP_UID}"
              PGID: "${APP_GID}"
              MEDIA_CONTAINER_ROOT: /mnt/media
              REDIS_URL: redis://shared-redis.databases.svc.cluster.local:6379/7
              POSTGRES_TUNE: "off"
            envFrom:
              - secretRef:
                  name: silo
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: 8080
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/ready
                    port: 8080
                  failureThreshold: 6
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 8Gi
                amd.com/gpu: 0

    service:
      app:
        controller: silo
        ports:
          http:
            port: 8080

    persistence:
      config:
        existingClaim: "${APP}"
        # only persist Silo's own data; the image also creates postgres/redis/
        # meilisearch dirs (0750, foreign uids) in /config which are unused here
        # (external DB/Redis) and break the unprivileged volsync mover
        globalMounts:
          - path: /config/silo
            subPath: silo
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
      media:
        type: hostPath
        hostPath: /mnt/data/hdd/single/media
        globalMounts:
          - path: /mnt/media
            readOnly: true
      transcode:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-transcode
      download-artifacts:
        type: emptyDir
        globalMounts:
          - path: /tmp/silo-download-artifacts

    route:
      app:
        hostnames:
          - lucaflix.lucadev.de
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: app
                port: 8080
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Filme und Serien
          gethomepage.dev/group: Medien
          gethomepage.dev/icon: mdi-filmstrip-box
          gethomepage.dev/name: Silo

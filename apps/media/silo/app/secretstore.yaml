---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silo-pg-secret-reader
---
# Reads the generated role password from databases (RBAC: ../db/rbac.yaml)
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: silo-pg-password
spec:
  provider:
    kubernetes:
      remoteNamespace: databases
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: silo-pg-secret-reader

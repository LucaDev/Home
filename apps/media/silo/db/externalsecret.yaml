---
# Passwort der Rolle "silo" in shared-pg, einmalig generiert (refreshPolicy: CreatedOnce). Niemand muss es kennen:
# CNPG setzt es aus diesem Secret (managed.roles), die App liest es per SecretStore (../app/externalsecret.yaml).
# Ohne Sonderzeichen, damit es unescaped in die DATABASE_URL passt.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: silo-pg-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-pg
spec:
  refreshPolicy: CreatedOnce
  target:
    name: silo-pg
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: silo
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: silo-pg-password

---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: romm
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "RomM"
  origin: "https://romm.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/romm.svg"
  redirectUrl:
    - "https://romm.lucadev.de/api/oauth/openid"
  scopeMap:
    - group: media_users
      scopes: [email, groups, openid, profile]
    - group: admins
      scopes: [email, openid, profile]
  disableConsentPrompt: true
  allowInsecureClientDisablePkce: true

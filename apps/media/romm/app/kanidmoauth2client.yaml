---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: romm
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "RomM"
  origin: "https://romm.lucadev.de/"
  redirectUrl:
    - "https://romm.lucadev.de/api/oauth/openid"
  scopeMap:
    - group: media_users
      scopes: [email, groups, openid, profile]
    - group: admins
      scopes: [email, openid, profile]
  disableConsentPrompt: true
  allowInsecureClientDisablePkce: true

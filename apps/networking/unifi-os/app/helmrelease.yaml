---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-os
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-4
    namespace: flux-system
  values:
    controllers:
      unifi-os:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          # writable /sys/fs/cgroup for systemd as PID 1, see runtimeclass.yaml
          runtimeClassName: systemd
          # private GHCR package (github.com/LucaDev/UnifiOS6-On-K8s); secret created by hand, PAT with read:packages
          imagePullSecrets:
            - name: ghcr-pull
          # systemd shuts down on SIGRTMIN+3 (image STOPSIGNAL), give Postgres & co. time
          terminationGracePeriodSeconds: 180
          securityContext:
            seccompProfile:
              type: RuntimeDefault

        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 20Gi
              storageClass: ssd-dualreplica
              globalMounts:
                - path: /data
                  subPath: data
                - path: /persistent
                  subPath: persistent
                - path: /var/lib/unifi
                  subPath: unifi
                - path: /etc/rabbitmq/ssl
                  subPath: rabbitmq-ssl
                - path: /srv
                  subPath: srv

        initContainers:
          # unifi-core serves its UI cert from the data volume; put the cert-manager cert there
          install-cert:
            image: &image
              repository: ghcr.io/lucadev/unifios6-on-k8s
              # <uos>-n<network>-<commit>: the plain <uos>-n<network> tag is overwritten by every build
              tag: 6.0.21-n11.0.99-4e71b15
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                install -d -m 0755 /data/unifi-core/config
                install -m 0644 /certs/tls.crt /data/unifi-core/config/unifi-core.crt
                install -m 0600 /certs/tls.key /data/unifi-core/config/unifi-core.key

        containers:
          app:
            image: *image
            env:
              TZ: Europe/Berlin
              # must be a UUIDv5 (Network crash-loops otherwise); only written to /data/uos_uuid on first start
              UOS_UUID: b735f435-8426-523a-8645-22b0a6998b55
              FIRMWARE_PLATFORM: linux-x64
              # external PostgreSQL (shared-pg, see ../db) via the image's pgbouncer instead of the local clusters
              UOS_PG_HOST: shared-pg-rw.databases.svc
              UOS_PG_PORT: "5432"
              UOS_PG_USERLIST: /etc/uos-extpg/auth/userlist.txt
            # no privileged, no added capabilities. Privilege escalation stays allowed: the UniFi services use sudo.
            securityContext:
              privileged: false
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ping
                    path: /api/ping
                    port: 80
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ping
                  periodSeconds: 60
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ping
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                # includes the memory-backed emptyDirs below
                memory: 6Gi

    service:
      app:
        controller: unifi-os
        ports:
          https:
            port: 443
            protocol: HTTPS
      devices:
        # enable at cutover: unifi-controller still holds these ports on the node IP
        enabled: false
        controller: unifi-os
        type: LoadBalancer
        loadBalancerClass: "io.cilium/node"
        ports:
          inform:
            port: 8080
            protocol: TCP
          speedtest:
            port: 6789
            protocol: TCP
          stun:
            port: 3478
            protocol: UDP

    route:
      app:
        hostnames:
          - unifi-os.lucadev.de
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 443
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: UniFi OS
          gethomepage.dev/group: Netzwerk
          gethomepage.dev/icon: unifi
          gethomepage.dev/name: UniFi OS

    persistence:
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          unifi-os:
            app:
              - path: /run
      run-lock:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          unifi-os:
            app:
              - path: /run/lock
      tmp:
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          unifi-os:
            app:
              - path: /tmp
      unifi-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          unifi-os:
            app:
              - path: /var/opt/unifi/tmp
      pg-userlist:
        type: secret
        name: unifi-os-pg-userlist
        advancedMounts:
          unifi-os:
            app:
              - path: /etc/uos-extpg/auth
                readOnly: true
      cert:
        type: secret
        name: unifi-os-certificate
        advancedMounts:
          unifi-os:
            install-cert:
              - path: /certs
                readOnly: true

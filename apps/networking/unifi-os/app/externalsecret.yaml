---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifi-os-pg-secret-reader
---
# Reads the generated role passwords from databases (RBAC: ../db/rbac.yaml)
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: unifi-os-pg-passwords
spec:
  provider:
    kubernetes:
      remoteNamespace: databases
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: unifi-os-pg-secret-reader
---
# pgbouncer auth_file inside the UniFi OS container (UOS_PG_USERLIST)
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-os-pg-userlist
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: unifi-os-pg-passwords
  target:
    name: unifi-os-pg-userlist
    creationPolicy: Owner
    template:
      data:
        userlist.txt: |
          "unifi-core" "{{ .unifi_core }}"
          "ulp-go" "{{ .ulp_go }}"
          "unifi-directory" "{{ .unifi_directory }}"
          "ucs-agent" "{{ .ucs_agent }}"
          "unifi-identity-update" "{{ .unifi_identity_update }}"
          "unifi_network_admin" "{{ .unifi_network_admin }}"
  data:
    - secretKey: unifi_core
      remoteRef:
        key: unifi-os-pg-unifi-core
        property: password
    - secretKey: ulp_go
      remoteRef:
        key: unifi-os-pg-ulp-go
        property: password
    - secretKey: unifi_directory
      remoteRef:
        key: unifi-os-pg-unifi-directory
        property: password
    - secretKey: ucs_agent
      remoteRef:
        key: unifi-os-pg-ucs-agent
        property: password
    - secretKey: unifi_identity_update
      remoteRef:
        key: unifi-os-pg-unifi-identity-update
        property: password
    - secretKey: unifi_network_admin
      remoteRef:
        key: unifi-os-pg-unifi-network-admin
        property: password

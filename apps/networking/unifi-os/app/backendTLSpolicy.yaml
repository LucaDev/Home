---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: unifi-os-backend-tls
spec:
  targetRefs:
    - group: ''
      kind: Service
      # app-template appends the identifier once there is more than one service (app, devices)
      name: unifi-os-app
      sectionName: https
  validation:
    wellKnownCACertificates: "System"
    hostname: unifi.lucadev.de

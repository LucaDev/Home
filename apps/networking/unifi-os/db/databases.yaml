---
# Same databases as UniFi OS creates locally. Each role owns its DB: on PostgreSQL 15+ only the owner
# may create tables in the public schema (UniFi's local PG 14 used owner postgres + GRANT ALL).
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: unifi-os-pg-unifi-core
spec:
  cluster:
    name: shared-pg
  name: unifi-core
  owner: unifi-core
  template: template0
  encoding: UTF8
  localeCollate: C.UTF-8
  localeCType: C.UTF-8
---

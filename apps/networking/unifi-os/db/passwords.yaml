---
# Passwords of the UniFi OS roles in shared-pg, generated once. Nobody needs to know them: CNPG sets them from
# these secrets (managed.roles) and the UniFi pod gets them as pgbouncer userlist (../app/externalsecret.yaml).
# No symbols: pgbouncer's userlist format quotes with ".
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: unifi-os-pg-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-os-pg-unifi-core
spec:
  refreshPolicy: CreatedOnce
  target:
    name: unifi-os-pg-unifi-core
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: unifi-core
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: unifi-os-pg-password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json

---
# UniFi OS roles (managed in apps/databases/shared-pg) need these secrets; databases live in shared-pg
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./passwords.yaml
  - ./rbac.yaml
  - ./databases.yaml

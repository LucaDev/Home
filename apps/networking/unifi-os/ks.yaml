---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname unifi-os
  namespace: flux-system
spec:
  interval: 1h
  path: "./apps/networking/unifi-os/app"
  targetNamespace: networking
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  dependsOn:
    - name: external-secrets-stores
    - name: envoy-gateway
    - name: volsync
    - name: unifi-os-db
  postBuild:
    substitute:
      APP: *appname
      # mixed file ownership (root, postgres, unifi, rabbitmq) in the volume
      APP_UID: "0"
      APP_GID: "0"
      VOLSYNC_CLAIM: data-unifi-os-0
      VOLSYNC_CACHE_CAPACITY: 5Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unifi-os-db
  namespace: flux-system
spec:
  interval: 1h
  path: "./apps/networking/unifi-os/db"
  # role secrets and Database CRs live next to shared-pg
  targetNamespace: databases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: external-secrets-stores
    - name: shared-pg

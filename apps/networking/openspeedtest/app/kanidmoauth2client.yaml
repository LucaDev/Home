---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: openspeedtest
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "OpenSpeedtest"
  origin: "https://speedtest.lucadev.de/"
  redirectUrl:
    - "https://speedtest.lucadev.de/oidc/callback"
  scopeMap:
    - group: idm_all_persons
      scopes: [email, groups, openid, profile]
  disableConsentPrompt: true

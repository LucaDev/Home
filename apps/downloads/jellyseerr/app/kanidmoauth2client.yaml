---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: jellyseerr
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Jellyseerr"
  origin: "https://seerr.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/seerr.svg"
  redirectUrl:
    - "https://jellyseerr.lucadev.de/login/oidc/callback/kanidm"
    - "https://seerr.lucadev.de/api/v1/auth/oidc/callback/kanidm"
  scopeMap:
    - group: admin
      scopes:
        - email
        - groups
        - openid
        - profile
    - group: media_users
      scopes:
        - email
        - groups
        - openid
        - profile
  preferShortUsername: true
  disableConsentPrompt: true
  allowInsecureClientDisablePkce: true

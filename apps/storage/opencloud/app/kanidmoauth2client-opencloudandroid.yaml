---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: opencloudandroid
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "OpenCloudAndroid"
  origin: "oc://android.opencloud.eu"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/open-cloud.svg"
  public: true
  redirectUrl: []
  scopeMap:
    - group: file_users
      scopes: [email, groups, offline_access, openid, profile]
  preferShortUsername: true

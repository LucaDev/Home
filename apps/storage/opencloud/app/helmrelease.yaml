---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      opencloud:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-config:
            image:
              repository: docker.io/opencloudeu/opencloud-rolling
              tag: 9.0.0@sha256:bd57f039d0dd3df510fb25f178beefdf0b1f049097285feead607824460e6506
            command:
              - /bin/sh
              - -c
              - test -f /etc/opencloud/opencloud.yaml || opencloud init --insecure=true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/opencloudeu/opencloud-rolling
              tag: 9.0.0@sha256:bd57f039d0dd3df510fb25f178beefdf0b1f049097285feead607824460e6506
            env:
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/proxy/csp.yaml
              WEB_OIDC_SCOPE: "openid profile email groups"
              # OIDC configuration
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
              OC_OIDC_ISSUER: https://idm.lucadev.de/oauth2/openid/web
              PROXY_OIDC_REWRITE_WELLKNOWN: true
              PROXY_USER_OIDC_CLAIM: preferred_username
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: true
              GRAPH_USERNAME_MATCH: none
              OC_EXCLUDE_RUN_SERVICES: idp
              OC_URL: https://cloud.lucadev.de
              # do not use SSL between Envoy and OpenCloud
              PROXY_TLS: "false"
              OC_INSECURE: "false"
              # Other settings
              OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "false"
              FRONTEND_CHECK_FOR_UPDATES: "false"
              # PosixFS collaborative mode
              STORAGE_USERS_POSIX_WATCH_FS: "true"
              # Collaborative editing via yjs
              WEB_OPTION_YJS_SERVER_URL: wss://cloud.lucadev.de/yjs
              WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: openid profile email
              WEBFINGER_IOS_OIDC_CLIENT_SCOPES: openid profile email
              WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: openid profile email
            command:
              - "opencloud"
              - "server"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 9200
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 128m
                memory: 128Mi
              limits:
                memory: 2Gi
      yjs:
        # rooms live in process memory, so all peers must hit the same instance
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 20
        containers:
          app:
            image:
              repository: docker.io/opencloudeu/yjs
              tag: 1.1.1@sha256:370ea8387e7896470b0c52d38769359ad5772d79a403d1bb5eb6d047b0789b35
            env:
              PORT: "1234"
              # internal address, no TLS between the pods
              OPENCLOUD_URL: http://opencloud-app:9200
              SHUTDOWN_GRACE_PERIOD_MS: "15000"
            probes:
              liveness: &yjsProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/ready
                    port: &yjsPort 1234
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *yjsProbes
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: opencloud
        ports:
          http:
            port: *port
      yjs:
        controller: yjs
        ports:
          http:
            port: *yjsPort
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ssd-dualreplica
        globalMounts:
          - path: /etc/opencloud
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: cached-dualreplica
        globalMounts:
          - path: /var/lib/opencloud
      apps:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ssd-dualreplica
        globalMounts:
          - path: /var/lib/opencloud/web/assets/apps
      homes:
        type: hostPath
        hostPath: /mnt/data/cached/single/homes/
        globalMounts:
          - path: /mnt/homes
      public:
        type: hostPath
        hostPath: /mnt/data/cached/single/public-share/
        globalMounts:
          - path: /mnt/public

    route:
      app:
        hostnames:
          - "cloud.lucadev.de"
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        rules:
          # hocuspocus ignores the path, the room is sent over the socket
          - matches:
              - path:
                  type: PathPrefix
                  value: /yjs
            backendRefs:
              - name: yjs
                port: *yjsPort
          - backendRefs:
              - name: app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Dateibrowser
          gethomepage.dev/group: Weitere
          gethomepage.dev/icon: opencloud
          gethomepage.dev/name: Cloud

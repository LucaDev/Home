---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-4
    namespace: flux-system
  values:
    controllers:
      local-path-provisioner:
        serviceAccount:
          identifier: local-path-provisioner-service-account
        pod:
          automountServiceAccountToken: true
          nodeSelector:
            kubernetes.io/os: linux
          priorityClassName: system-node-critical
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        containers:
          app:
            image:
              repository: rancher/local-path-provisioner
              tag: v0.0.37
            command:
              - local-path-provisioner
              - start
              - --config
              - /etc/config/config.json
            env:
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    serviceAccount:
      local-path-provisioner-service-account:
        forceRename: local-path-provisioner-service-account

    rbac:
      roles:
        local-path-provisioner:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["endpoints", "persistentvolumes", "pods"]
              verbs: ["*"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create", "patch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
      bindings:
        local-path-provisioner:
          type: ClusterRoleBinding
          roleRef:
            identifier: local-path-provisioner
          subjects:
            - identifier: local-path-provisioner-service-account

    persistence:
      config:
        type: configMap
        name: local-path-config
        globalMounts:
          - path: /etc/config/config.json
            subPath: config.json
            readOnly: true

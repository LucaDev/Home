---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname rustfs
  namespace: flux-system
spec:
  path: ./apps/storage/rustfs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-secrets-stores
    - name: volsync
  postBuild:
    substitute:
      APP: *appname
      VOLSYNC_CLAIM: rustfs-data
      APP_UID: "10001"
      APP_GID: "10001"

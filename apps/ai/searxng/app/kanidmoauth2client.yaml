---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: searxng
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Search"
  origin: "https://search.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/searxng.svg"
  redirectUrl:
    - "https://search.lucadev.de/oidc/callback"
  scopeMap:
    - group: idm_all_persons
      scopes:
        - email
        - openid
        - profile
  preferShortUsername: true
  disableConsentPrompt: true
  secretKeyAliases:
    clientSecret:
      - client-secret

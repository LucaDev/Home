---
# In-cluster API access for agents; bypasses the gateway OIDC on purpose.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-ingress-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-webui
        # n8n lives in another namespace, so it needs an explicit namespaceSelector.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: home-automation
          podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
      ports:
        - port: 8080
          protocol: TCP

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./kanidmoauth2client.yaml
  - ./securitypolicy.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: searxng-config
    files:
      - ./resources/limiter.toml
      - ./resources/settings.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../../components/netpol/dns-envoy
  - ../../../../components/netpol/egress-internet
  - ../../../../components/netpol/egress-redis

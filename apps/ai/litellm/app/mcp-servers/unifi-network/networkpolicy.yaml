---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-network-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3000
          protocol: TCP

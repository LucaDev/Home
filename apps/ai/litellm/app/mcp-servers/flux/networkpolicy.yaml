---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8000
          protocol: TCP

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: mikrotik-mcp
    creationPolicy: Owner
    template:
      data:
        # The inventory carries the SSH credentials, so it lives in the Secret.
        # Both devices share one read-only user (group with the read and ssh policies).
        MIKROTIK_INVENTORY: >-
          [{"title": "router", "host": "192.168.1.1", "port": 22,
          "username": {{ .MIKROTIK_MCP_USERNAME | toJson }}, "password": {{ .MIKROTIK_MCP_PASSWORD | toJson }},
          "tags": ["rb4011", "router"]},
          {"title": "sfp-switch", "host": "192.168.1.37", "port": 22,
          "username": {{ .MIKROTIK_MCP_USERNAME | toJson }}, "password": {{ .MIKROTIK_MCP_PASSWORD | toJson }},
          "tags": ["switch", "sfp"]}]
  data:
    - secretKey: MIKROTIK_MCP_USERNAME
      remoteRef:
        key: litellm
        property: MIKROTIK_MCP_USERNAME
    - secretKey: MIKROTIK_MCP_PASSWORD
      remoteRef:
        key: litellm
        property: MIKROTIK_MCP_PASSWORD

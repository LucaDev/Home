---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mikrotik-mcp
spec:
  alias: mikrotik
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/wiresage/mikrotik-mcp:0.27.0@sha256:d6cfa94c881f37031ea4e9d797c0147087a80ce6a5222d467200145b419b2a7c
    automountServiceAccountToken: false
    env:
      - name: MIKROTIK_MCP__ALLOWED_HOSTS
        value: mikrotik-mcp.ai.svc.cluster.local:*,mikrotik-mcp:*
      - name: MIKROTIK_MCP__TRANSPORT
        value: streamable-http
      - name: MIKROTIK_READ_ONLY
        value: "true"
      - name: MIKROTIK_SENSITIVE_HIDING
        value: "true"
    # MIKROTIK_INVENTORY (router and SFP switch over SSH) comes from the Secret.
    envFrom:
      - secretRef:
          name: mikrotik-mcp
    path: /mcp
    podLabels:
      app.kubernetes.io/name: mikrotik-mcp
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    port: 8000
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}

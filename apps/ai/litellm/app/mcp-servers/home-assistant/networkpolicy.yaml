---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: home-assistant-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-mcp
  policyTypes:
    - Ingress
  # ha-mcp has no authentication of its own here: only LiteLLM may call it.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8086
          protocol: TCP

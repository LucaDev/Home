---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # Encrypts provider credentials stored in the database. Must never change
        # once the database holds data.
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        DATABASE_URL: "postgresql://litellm:{{ .DB_PASSWORD }}@shared-pg-rw.databases.svc.cluster.local:5432/litellm"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: LITELLM_MASTER_KEY
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: litellm
        property: LITELLM_SALT_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: litellm
        property: DB_PASSWORD
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: litellm
        property: OPENROUTER_API_KEY

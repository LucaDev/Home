---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template-4
    namespace: flux-system
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # WebUI rejects OIDC endpoints that resolve to private IPs. The router dst-nats this
          # non-RFC1918 address to envoy (keep in sync with its NAT rule); TLS still validates.
          hostAliases:
            - ip: 100.64.0.10
              hostnames:
                - idm.lucadev.de
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          profile-seed:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
            command:
              - /bin/bash
              - /seed/seed.sh
            env:
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
            envFrom:
              - secretRef:
                  name: hermes-secret
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config was seeded.
          config-migrate:
            dependsOn: profile-seed
            image: *image
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            args:
              - "sleep"
              - "infinity"
            env:
              BASH_ENV: /opt/data/.hermes-terminal-env.sh
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # Hermes settings
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              LITELLM_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                memory: 1Gi
                cpu: 10m
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.573@sha256:8b94d575eed895e712fd4def5e762c58000edbf1f338f0468e8e24e047c376b4
            env:
              HERMES_API_URL: http://127.0.0.1:8642
              HERMES_HOME: /home/hermeswebui/.hermes
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_DEFAULT_WORKSPACE: /home/hermeswebui/.hermes/workspace
              HERMES_WEBUI_GATEWAY_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: API_SERVER_KEY
              HERMES_WEBUI_GATEWAY_BASE_URL: http://127.0.0.1:8642
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
              HERMES_WEBUI_HOST: 0.0.0.0
              HERMES_WEBUI_OIDC_ALLOW_CLAIM: hermes_access
              HERMES_WEBUI_OIDC_ALLOW_VALUES: admin
              HERMES_WEBUI_OIDC_CLIENT_ID: hermes
              HERMES_WEBUI_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_WEBUI_OIDC_ISSUER: https://idm.lucadev.de/oauth2/openid/hermes
              HERMES_WEBUI_OIDC_REDIRECT_URI: https://hermes.lucadev.de/api/auth/oidc/callback
              HERMES_WEBUI_PORT: &port 8787
              HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
              HOME: /home/hermeswebui
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              UV_CACHE_DIR: /uv_cache
              # The agent needs a newer Python than the image ships; uv downloads it here
              # instead of the read-only ~/.local/share/uv/python.
              UV_PYTHON_INSTALL_DIR: /uv_cache/python
              WANTED_GID: "10000"
              WANTED_UID: "10000"
            # The init script runs as PID 1 without forwarding SIGTERM; signal server.py directly.
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - kill -TERM $(cat /proc/1/task/1/children)
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 90
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
            profile-seed:
              - path: /opt/data
            webui:
              - path: /home/hermeswebui/.hermes
      agent-source:
        type: image
        image: *image
        advancedMounts:
          hermes:
            webui:
              - path: /home/hermeswebui/.hermes/hermes-agent
                subPath: opt/hermes
                readOnly: true
      app:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /app
      profile-seed:
        type: configMap
        name: hermes-profile-seed
        advancedMounts:
          hermes:
            profile-seed:
              - path: /seed
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.10.25
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
            profile-seed:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      uv-cache:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /uv_cache

    route:
      app:
        hostnames:
          - hermes.lucadev.de
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: KI-Agent
          gethomepage.dev/group: Weitere
          gethomepage.dev/icon: sh-hermes-agent.svg
          gethomepage.dev/name: Hermes

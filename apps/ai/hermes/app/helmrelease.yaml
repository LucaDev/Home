---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template-4
    namespace: flux-system
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # The OIDC client rejects endpoints that resolve to private IPs. The router dst-nats this
          # non-RFC1918 address to envoy (keep in sync with its NAT rule); TLS still validates.
          hostAliases:
            - ip: 100.64.0.10
              hostnames:
                - idm.lucadev.de
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config exists yet.
          config-migrate:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # Explicitly start the gateway under s6; sleep alone only restores saved run intent.
            args:
              - gateway
              - run
            env:
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # Hermes settings
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              PATH: /opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/opt/hermes/.venv/bin:/opt/hermes/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              LITELLM_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                memory: 1536Mi
                cpu: 110m
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119

    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      # Read by each profile's secrets.command helper.
      litellm-token:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.10.22
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      webapp:
        hostnames:
          - hermes.lucadev.de
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: KI-Agent
          gethomepage.dev/group: Weitere
          gethomepage.dev/icon: sh-hermes-agent.svg
          gethomepage.dev/name: Hermes
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
            timeouts:
              request: 0s
      dashboard:
        hostnames:
          - hermes-dash.lucadev.de
        parentRefs:
          - name: envoy
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard

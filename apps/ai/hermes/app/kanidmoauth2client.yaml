---
# Confidential client shared by the Hermes Dashboard and native Webapp.
# kaniop writes credentials to hermes-kanidm-oauth2-credentials; both use PKCE.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Hermes"
  origin: "https://hermes.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/hermes-agent.svg"
  redirectUrl:
    - "https://hermes.lucadev.de/auth/callback"
    - "https://hermes-dash.lucadev.de/auth/callback"
  # Every signed-in user gets full agent (shell) access.
  scopeMap:
    - group: admins
      scopes: [email, openid, profile]
  claimMap:
    - name: hermes_access
      valuesMap:
        - group: admins
          values:
            - admin
      joinStrategy: csv
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true

---
# Confidential client for Hermes WebUI's native OIDC provider. kaniop writes the
# credentials to hermes-kanidm-oauth2-credentials; WebUI sends the secret with PKCE.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Hermes"
  origin: "https://hermes.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/hermes-agent.svg"
  redirectUrl:
    - "https://hermes.lucadev.de/api/auth/oidc/callback"
  scopeMap:
    - group: admins
      scopes: [email, openid, profile]
  # WebUI only admits identities carrying this claim (HERMES_WEBUI_OIDC_ALLOW_CLAIM).
  # Every signed-in user gets full agent (shell) access.
  claimMap:
    - name: hermes_access
      valuesMap:
        - group: admins
          values:
            - admin
      joinStrategy: csv
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true

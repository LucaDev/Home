---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./kanidmoauth2client.yaml
  - ./litellmvirtualkey.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: hermes-profile-seed
    files:
      - ./resources/profile-seed/config.yaml
      - ./resources/profile-seed/SOUL.md
      - ./resources/profile-seed/seed.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../../../components/volsync/hetzner

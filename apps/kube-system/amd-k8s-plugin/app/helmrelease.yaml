---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-device-plugin
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template-4
    namespace: flux-system
  values:
    defaultPodOptions:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      priorityClassName: system-node-critical
    controllers:
      amd-device-plugin:
        type: daemonset
        containers:
          app:
            image:
              repository: docker.io/rocm/k8s-device-plugin
              tag: 1.31.0.11@sha256:e4df5dc9a7fa34e2344852256dcc5762171a6d68f1f9a34026ce26786ae335e2
            workingDir: /root
            command:
              - "./k8s-device-plugin"
            args:
              - "-logtostderr=true"
              - "-stderrthreshold=INFO"
              - "-v=5"
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
    persistence:
      sys:
        type: hostPath
        hostPath: /sys
      device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
      health:
        type: hostPath
        hostPath: /var/lib/amd-metrics-exporter/

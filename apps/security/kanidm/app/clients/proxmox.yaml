---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: proxmox
spec:
  kanidmRef:
    name: kanidm
  displayname: "Proxmox"
  origin: "https://10.0.0.1/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/proxmox.svg"
  redirectUrl:
    - "https://10.0.0.1/"
  scopeMap:
    - group: admins
      scopes: [email, groups, openid, profile]
  preferShortUsername: true
  disableConsentPrompt: true
  # Proxmox unterstützt kein PKCE
  allowInsecureClientDisablePkce: true

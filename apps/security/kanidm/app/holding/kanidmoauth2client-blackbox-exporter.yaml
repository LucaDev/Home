---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: blackbox-exporter
spec:
  kanidmRef:
    name: kanidm
  displayname: "Blackbox-Exporter"
  origin: "https://blackbox-exporter.lucadev.de/"
  redirectUrl:
    - "https://blackbox-exporter.lucadev.de/oidc/callback"
  scopeMap:
    - group: idm_all_persons
      scopes: [email, groups, openid, profile]
  disableConsentPrompt: true

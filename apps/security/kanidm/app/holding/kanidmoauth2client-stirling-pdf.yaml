---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: stirling-pdf
spec:
  kanidmRef:
    name: kanidm
  displayname: "Stirling-PDF"
  origin: "https://pdf.lucadev.de/"
  redirectUrl:
    - "https://pdf.lucadev.de/oidc/callback"
  scopeMap:
    - group: service_users
      scopes: [email, openid, profile]
  disableConsentPrompt: true

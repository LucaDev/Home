---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: calibre-web
spec:
  kanidmRef:
    name: kanidm
  displayname: "Calibre"
  origin: "https://calibre.lucadev.de/"
  redirectUrl:
    - "https://calibre.lucadev.de/oidc/callback"
  scopeMap:
    - group: media_guests
      scopes: [email, groups, openid, profile]
  disableConsentPrompt: true

---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: prometheus
spec:
  kanidmRef:
    name: kanidm
  displayname: "Prometheus"
  origin: "https://prometheus.lucadev.de/"
  redirectUrl:
    - "https://prometheus.lucadev.de/oidc/callback"
  scopeMap:
    - group: admins
      scopes: [email, groups, openid, profile]
  disableConsentPrompt: true

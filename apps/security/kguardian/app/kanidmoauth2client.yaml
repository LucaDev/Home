---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: kguardian
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "kguardian"
  origin: "https://kguardian.lucadev.de/"
  redirectUrl:
    - "https://kguardian.lucadev.de/oidc/callback"
  scopeMap:
    - group: admins
      scopes: [email, openid, profile]
  disableConsentPrompt: true
  secretKeyAliases:
    clientSecret:
      - client-secret

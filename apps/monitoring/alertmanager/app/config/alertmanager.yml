---
receivers:
  - name: "null"
  - name: "healthchecks"
    webhook_configs:
      - url_file: /etc/secrets/healthchecks_watchdog_url
        send_resolved: false
  - name: "discord"
    discord_configs:
      - webhook_url_file: /etc/secrets/discord_alert_webhook
        send_resolved: true

route:
  group_by:
    - "alertname"
    - "job"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  receiver: "discord"
  routes:
    # Dead man's switch: Watchdog fires permanently, healthchecks.io alerts when pings stop
    - receiver: "healthchecks"
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"
    - receiver: "discord"
      matchers:
        - severity = critical
      continue: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal:
      - "alertname"
      - "namespace"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unpoller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: unifi-os
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP

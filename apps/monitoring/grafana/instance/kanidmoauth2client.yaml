---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "Grafana"
  origin: "https://grafana.lucadev.de/"
  image:
    url: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons@main/svg/grafana.svg"
  redirectUrl:
    - "https://grafana.lucadev.de/login/generic_oauth"
  scopeMap:
    - group: service_users
      scopes: [email, groups, openid, profile]
    - group: admins
      scopes: [email, groups, openid, profile]
  preferShortUsername: true
  disableConsentPrompt: true

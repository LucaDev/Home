---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  alias: grafana
  # Runs next to Grafana (token Secret is namespaced), registered on the proxy in ai.
  proxyNamespace: ai
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    args:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --disable-write
      - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.monitoring.svc.cluster.local:8000,grafana-mcp.monitoring:8000,grafana-mcp:8000
    automountServiceAccountToken: false
    env:
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
        value: /var/run/secrets/grafana/token
      - name: GRAFANA_URL
        value: http://grafana-service.monitoring.svc.cluster.local:3000
      - name: GRAFANA_USAGE_STATS
        value: disabled
    path: /mcp
    podLabels:
      app.kubernetes.io/name: grafana-mcp
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumes:
      - name: grafana-token
        secret:
          secretName: grafana-mcp-token
    volumeMounts:
      - name: grafana-token
        mountPath: /var/run/secrets/grafana
        readOnly: true

---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: n8n
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: "n8n"
  origin: "https://n8n.lucadev.de/"
  redirectUrl:
    - "https://n8n.lucadev.de/oidc/callback"
  scopeMap:
    - group: admins
      scopes: [email, openid, profile]
  disableConsentPrompt: true
